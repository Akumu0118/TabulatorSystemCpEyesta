<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F4FD8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ICPEP Tabulator</title>
    <script>
      // Apply saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('tab_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
