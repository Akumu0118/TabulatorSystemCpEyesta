# ICPEP Tabulator: Django + PostgreSQL.
#   docker compose up -d --build
# The app is published on every host interface, so judges on the same Wi-Fi/LAN
# can open http://<host-LAN-IP>:${APP_PORT}, or https://<host-LAN-IP>:${HTTPS_PORT} after the
# one-time phone setup at http://<host-LAN-IP>:${APP_PORT}/setup.
# Use scripts/start-lan.* to fill in HOST_LAN_IP and the HTTPS site list.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tabulator}
      POSTGRES_USER: ${POSTGRES_USER:-tabulator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the web container talks to the database.

  web:
    build: .
    image: icpep-tabulator:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      ADMIN_PASS: ${ADMIN_PASS:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-tabulator}
      POSTGRES_USER: ${POSTGRES_USER:-tabulator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      HOST_LAN_IP: ${HOST_LAN_IP:-}
      PUBLIC_PORT: ${APP_PORT:-8000}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      DETECT_LAN_IPS: "false"
      BEHIND_PROXY: "true"
    # Not published: phones reach it through the proxy below.

  proxy:
    # Plain HTTP on APP_PORT and local HTTPS on HTTPS_PORT (Caddy's own CA, no internet needed).
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CADDY_SITES: ${CADDY_SITES:-https://localhost:8443}
      TLS_DEFAULT_SNI: ${TLS_DEFAULT_SNI:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps the certificate authority, so phones only install its certificate once.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # 0.0.0.0 = reachable from other devices on the LAN, not just this computer.
      - "0.0.0.0:${APP_PORT:-8000}:8000"
      - "0.0.0.0:${HTTPS_PORT:-8443}:8443"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
